<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acme Analytics (demo page)</title>
  <style>
    :root { --bg: #f5f6f8; --card: #fff; --text: #1c2024; --muted: #60646c; --line: #e0e1e6; --brand: #3e63dd; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); }
    header { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; background: var(--card); border-bottom: 1px solid var(--line); }
    header h1 { font-size: 18px; margin: 0; }
    nav a { color: var(--muted); margin-left: 18px; text-decoration: none; }
    main { padding: 24px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; max-width: 1100px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
    .stat .value { font-size: 28px; font-weight: 700; }
    .stat .label { color: var(--muted); }
    .wide { grid-column: span 2; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
    button.primary { background: #8b8d98; color: #fff; border-color: #8b8d98; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
    .empty { min-height: 220px; border: 1px dashed var(--line); background: transparent; }
  </style>
</head>
<body>
  <header>
    <h1>Acme Analytics</h1>
    <nav><a href="#">Overview</a><a href="#">Reports</a><a href="#">Settings</a></nav>
  </header>
  <main>
    <section class="card stat" id="revenue"><div class="label">Revenue</div><div class="value">$48.2k</div></section>
    <section class="card stat" id="users"><div class="label">Active users</div><div class="value">3,914</div></section>
    <section class="card stat" id="churn"><div class="label">Churn</div><div class="value">2.1%</div></section>
    <section class="card wide" id="orders">
      <h2>Recent orders</h2>
      <table>
        <thead><tr><th>Order</th><th>Customer</th><th>Total</th></tr></thead>
        <tbody>
          <tr><td>#1042</td><td>Northwind</td><td>$1,200</td></tr>
          <tr><td>#1041</td><td>Contoso</td><td>$860</td></tr>
          <tr><td>#1040</td><td>Fabrikam</td><td>$2,310</td></tr>
        </tbody>
      </table>
      <div class="actions">
        <button class="primary" id="export-report" type="button">Export report</button>
        <button type="button">Filter</button>
      </div>
    </section>
    <section class="card empty" id="slot" aria-label="Empty slot"></section>
  </main>
</body>
</html>
